# Pinned upstream revisions for the GTK2-on-Wayland stack.
#
# The shim (xlib-wayland) is a separate upstream project.  Every shim
# accommodation for GTK2 belongs there; this file only records which revision
# of it this tree was last tested against.
#
# Format:  NAME=value   (shell-sourceable)

# --- the platform shim -------------------------------------------------------
# A git ref in https://github.com/jmalcolm137/xlib-wayland
XLIB_WAYLAND_REPO=https://github.com/jmalcolm137/xlib-wayland.git
XLIB_WAYLAND_REF=main

# --- the toolkit under test --------------------------------------------------
# The last GTK+ 2 release published at https://download.gnome.org/sources/gtk+/
GTK2_VERSION=2.24.33
GTK2_TARBALL=gtk+-2.24.33.tar.xz
GTK2_URL=https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz
# sha256 of the tarball as served by download.gnome.org
GTK2_SHA256=ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da

# --- the supporting stack (MATE 1.10 era, c. 2016) ---------------------------
# One stack must serve GTK+ 2.24.33, MATE 1.10 and GIMP 2.10.  MATE 1.10 is the
# oldest and the most demanding: it defines compat functions (e.g. g_strv_equal)
# that GLib added in 2.60, so a 2.60+ stack collides with it.  Pango 1.48 in
# turn requires GLib >= 2.62.  The common denominator is the MATE-era stack
# below; GTK2 and GIMP only set lower bounds and build against it happily.
# (glib/atk/dconf use autotools here; pango/gdk-pixbuf use meson.)
GLIB_VERSION=2.48.2
ATK_VERSION=2.18.0
PANGO_VERSION=1.38.1
GDK_PIXBUF_VERSION=2.34.0
# dconf is linked by GTK2-era applications for GSettings.  The host's dconf is
# built against a much newer GLib and needs symbols GLib 2.48 does not have.
DCONF_VERSION=0.26.0
# libxklavier: libmatekbd and mate-settings-daemon need it.  The host's copy is
# built against GLib 2.80 and cannot load with GLib 2.48.
LIBXKLAVIER_VERSION=5.4
# libunique 1.0 (GTK2): caja's single-instance mechanism.
LIBUNIQUE_VERSION=1.1.6
# gtksourceview 2.x (GTK2): pluma's editor widget.
GTKSOURCEVIEW_VERSION=2.10.5
# PCRE 1.x and vte 0.28 (GTK2): mate-terminal's terminal widget.
PCRE_VERSION=8.45
VTE_VERSION=0.28.2
# libwnck 2.30 (GTK2): marco, mate-panel, mate-applets; libsoup 2.54 for
# libmateweather (host libsoup 2.74 requires GLib >= 2.58).
LIBWNCK_VERSION=2.30.7
LIBSOUP_VERSION=2.54.1
# libgtop (marco, mate-system-monitor) and libcanberra-gtk (marco,
# mate-settings-daemon, mate-media).  Host copies need a newer GLib.
LIBGTOP_VERSION=2.40.0
LIBCANBERRA_VERSION=0.30
# librsvg 2.40 (needs libcroco) for mate-panel/clock: host librsvg requires
# GLib >= 2.50.
LIBCROCO_VERSION=0.6.13
LIBRSVG_VERSION=2.40.20
# The gtkmm 2.4 C++ bindings for mate-system-monitor (glibmm 2.48 matches the
# era GLib 2.48; gtkmm 2.24 is the GTK2 binding).
LIBSIGCPP_VERSION=2.10.0
GLIBMM_VERSION=2.48.1
CAIROMM_VERSION=1.12.0
PANGOMM_VERSION=2.40.1
ATKMM_VERSION=2.24.2
GTKMM_VERSION=2.24.5
# poppler-glib for atril: a GTK2-era build linked against the prefix GLib.
POPPLER_VERSION=0.42.0

# --- the compositor used for the test suite ----------------------------------
# Distro packages are extracted into a local prefix (no root needed); see
# scripts/setup-labwc.sh.  Versions are the Arch/EndeavourOS packages used.
LABWC_VERSION=0.20.2
LIBSFDO_VERSION=0.1.4

# --- the test harness --------------------------------------------------------
# GTest binaries are driven by gtester.  The prefix's GLib 2.66 ships gtester
# and gtester-report; on hosts where GLib has removed them (after 2.60),
# stage_glib_tools stages the distro's glib2-devel package to obtain them.
GTESTER=prefix-or-glib2-devel
